# Production stack for one server: API, Postgres, and Caddy for HTTPS and the admin site.
# Run through deploy/deploy.sh; see deploy/README.md for first-time setup.
name: farmer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env.production
    environment:
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: `docker compose run --rm migrate`
  migrate:
    build:
      context: .
      target: build
    env_file: .env.production
    command: ["npm", "run", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../admin-web/dist:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
